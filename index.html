<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Remise Dashboard - Schloss Hagerhof</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b132b;
      color: #ffffff;
      font-family: Arial, sans-serif;
      padding: 25px;
    }
    header {
      background: #1c2541;
      border: 1px solid #475569;
      border-radius: 12px;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    .logo {
      background: #c5a059;
      color: #0b132b;
      font-weight: bold;
      font-size: 22px;
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 15px;
      vertical-align: middle;
    }
    h2 { color: #c5a059; margin: 25px 0 15px 0; font-size: 20px; border-bottom: 2px solid #1c2541; padding-bottom: 5px; }
    .grid {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }
    .card {
      background: #1c2541;
      border: 1px solid #475569;
      border-radius: 10px;
      padding: 15px;
      flex: 1;
      min-width: 160px;
    }
    .card.today {
      border: 2px solid #c5a059;
      background: #252e4d;
    }
    .title { font-weight: bold; font-size: 15px; border-bottom: 1px solid #475569; padding-bottom: 8px; margin-bottom: 10px; color: #fff; }
    .label { font-size: 10px; text-transform: uppercase; color: #c5a059; margin-top: 8px; font-weight: bold; }
    .val { background: rgba(0,0,0,0.3); padding: 6px; border-radius: 4px; margin-top: 3px; font-size: 13px; color: #e2e8f0; }
    .exam-badge { background: #7f1d1d; color: #fecaca; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 5px; }
  </style>
</head>
<body>

  <header>
    <div>
      <span class="logo">R</span>
      <span style="font-size: 20px; font-weight: bold;">Internat Schloss Hagerhof – Wohngruppe Remise</span>
    </div>
    <div style="text-align: right;">
      <div id="clock" style="font-size: 22px; font-weight: bold; color: #c5a059;"></div>
      <div id="date" style="font-size: 12px; color: #94a3b8;"></div>
    </div>
  </header>

  <!-- Dienstplan -->
  <h2>📅 Dienstplan der Betreuer</h2>
  <div id="roster-container" class="grid"></div>

  <!-- Speiseplan -->
  <h2>🍽️ Wochenspeiseplan</h2>
  <div id="menu-container" class="grid"></div>

  <!-- Klausuren -->
  <h2>📝 Anstehende Klausuren & Leistungsnachweise</h2>
  <div id="exams-container" class="grid"></div>

  <!-- Ausflüge & Events -->
  <h2>🚌 Ausflüge, Fahrten & Wichtige Termine</h2>
  <div id="events-container" class="grid"></div>

  <script>
    const data = {
      roster: [
        { day: 'Sonntag', night: 'Hr. Müller', tag1: 'Fr. Weber' },
        { day: 'Montag', night: 'Fr. Schmidt', tag1: 'Hr. Müller', tag2: 'Fr. Meyer' },
        { day: 'Dienstag', night: 'Hr. Becker', tag1: 'Fr. Schmidt', tag2: 'Hr. Wagner' },
        { day: 'Mittwoch', night: 'Fr. Weber', tag1: 'Hr. Becker', tag2: 'Fr. Hoffmann' },
        { day: 'Donnerstag', night: 'Hr. Müller', tag1: 'Fr. Schmidt' },
        { day: 'Freitag', night: 'Fr. Meyer', tag1: 'Hr. Becker', tag2: 'Fr. Weber' }
      ],
      menu: [
        { day: 'Montag', dinner: 'Abendbrotzeit', sub: 'Brotauswahl & Salat' },
        { day: 'Dienstag', dinner: 'Gekochtes Abendessen', sub: 'Warmes Gericht & Nachtisch' },
        { day: 'Mittwoch', dinner: 'Gekochtes Abendessen', sub: 'Warmes Gericht mit Beilagen' },
        { day: 'Donnerstag', dinner: 'Reste-Essen', sub: 'Warme Reste & Brotzeit' },
        { day: 'Freitag', dinner: 'Abreise', sub: 'Heimreise (kein Abendessen)' }
      ],
      exams: [
        { subject: 'Mathematik', class: 'Klasse 10', date: 'Di, 10.03.', info: 'Schriftliche Klassenarbeit' },
        { subject: 'Englisch', class: 'Klasse 9', date: 'Mi, 11.03.', info: 'Vokabeltest & Grammar' },
        { subject: 'Deutsch', class: 'Klasse 8', date: 'Do, 12.03.', info: 'Inhaltsangabe schreiben' },
        { subject: 'Biologie', class: 'Klasse 7', date: 'Mo, 16.03.', info: 'Test zum Ökosystem' },
        { subject: 'Geschichte', class: 'Klasse 10', date: 'Di, 17.03.', info: 'Wiederholungstest' },
        { subject: 'Physik', class: 'Klasse 9', date: 'Fr, 20.03.', info: 'Klassenarbeit Mechanik' }
      ],
      events: [
        { title: 'Ausflug Kletterpark', time: 'Samstag, 14.03.', desc: 'Gemeinsamer Ausflug der Wohngruppe Remise.' },
        { title: 'Gruppenabend Remise', time: 'Dienstag, 19:00', desc: 'Wöchentliche Besprechung im Gemeinschaftsraum.' },
        { title: 'Zimmer-Check', time: 'Mittwoch, 16:30', desc: 'Ordnungs- und Sauberkeitskontrolle.' }
      ]
    };

    function render() {
      const today = new Date().toLocaleDateString('de-DE', { weekday: 'long' });

      // Roster
      document.getElementById('roster-container').innerHTML = data.roster.map(r => {
        const isToday = r.day.toLowerCase() === today.toLowerCase();
        return `
          <div class="card ${isToday ? 'today' : ''}">
            <div class="title">${r.day} ${isToday ? ' (HEUTE)' : ''}</div>
            <div class="label">Nachtdienst</div>
            <div class="val" style="color:#93c5fd; font-weight:bold;">🌙 ${r.night}</div>
            <div class="label">Tagdienst</div>
            <div class="val">☀️ ${r.tag1 || 'Keiner'}</div>
            ${r.tag2 ? `<div class="val">☀️ ${r.tag2}</div>` : ''}
          </div>
        `;
      }).join('');

      // Menu
      document.getElementById('menu-container').innerHTML = data.menu.map(m => {
        const isToday = m.day.toLowerCase() === today.toLowerCase();
        return `
          <div class="card ${isToday ? 'today' : ''}">
            <div class="title">${m.day} ${isToday ? ' (HEUTE)' : ''}</div>
            <div class="label">Abendessen</div>
            <div class="val" style="color:#c5a059; font-weight:bold;">${m.dinner}</div>
            <div style="font-size:11px; color:#94a3b8; margin-top:5px;">${m.sub}</div>
          </div>
        `;
      }).join('');

      // Exams (Klausuren)
      document.getElementById('exams-container').innerHTML = data.exams.map(ex => `
        <div class="card">
          <span class="exam-badge">${ex.class}</span>
          <div class="title" style="margin-top:5px;">${ex.subject}</div>
          <div class="label">Datum & Zeit</div>
          <div class="val" style="color:#c5a059; font-weight:bold;">📅 ${ex.date}</div>
          <div style="font-size:11px; color:#cbd5e1; margin-top:6px;">${ex.info}</div>
        </div>
      `).join('');

      // Events & Ausflüge
      document.getElementById('events-container').innerHTML = data.events.map(ev => `
        <div class="card" style="border-left: 4px solid #c5a059;">
          <div class="title">${ev.title}</div>
          <div style="color:#c5a059; font-size:12px; font-weight:bold; margin-bottom:5px;">⏰ ${ev.time}</div>
          <div style="font-size:12px; color:#cbd5e1;">${ev.desc}</div>
        </div>
      `).join('');

      // Clock
      document.getElementById('clock').innerText = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('date').innerText = new Date().toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    window.onload = () => {
      render();
      setInterval(render, 1000);
    };
  </script>
</body>
</html>
