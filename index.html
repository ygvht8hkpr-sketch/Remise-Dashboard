<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internat Schloss Hagerhof - Remise Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background-color: #0b132b;
      color: #f8fafc;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
    }
    header {
      background: rgba(28, 37, 65, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo-box {
      background-color: #c5a059;
      color: #0b132b;
      font-weight: bold;
      font-size: 24px;
      width: 45px;
      height: 45px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slide {
      display: none;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      padding: 10px 0;
    }
    .slide.active { display: flex; }
    h2 { font-size: 22px; margin-bottom: 15px; color: #fff; display: flex; align-items: center; gap: 10px; }
    .grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; height: 100%; }
    .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; height: 100%; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; height: 100%; }
    
    .card {
      background: rgba(28, 37, 65, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .card.today {
      border: 2px solid #c5a059 !important;
      background: rgba(197, 160, 89, 0.2) !important;
    }
    .badge-today {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #c5a059;
      color: #0b132b;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .card h3 { font-size: 16px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; margin-bottom: 10px; }
    .section-title { font-size: 10px; text-transform: uppercase; color: #c5a059; margin-top: 8px; font-weight: bold; }
    .box-info { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; margin-top: 4px; font-size: 13px; }
    
    footer {
      background: rgba(28, 37, 65, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 10px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .progress-container { width: 100%; background: #1e293b; height: 4px; border-radius: 2px; overflow: hidden; }
    .progress-bar { height: 100%; background: #c5a059; width: 0%; transition: width 0.1s linear; }
    .footer-info { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; }
    
    /* Admin Modal */
    #edit-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-content { background: #1e293b; border: 1px solid #475569; width: 800px; max-height: 85vh; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .modal-body { overflow-y: auto; flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .input-group { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; }
    .input-group label { font-size: 11px; color: #94a3b8; display: block; margin-bottom: 3px; }
    .input-group input { width: 100%; background: #1e293b; border: 1px solid #475569; color: #fff; padding: 6px; border-radius: 4px; font-size: 13px; }
    .btn { background: #c5a059; color: #0b132b; font-weight: bold; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
    .btn-sec { background: #334155; color: #fff; font-weight: bold; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div style="display: flex; align-items: center; gap: 15px;">
      <div class="logo-box">R</div>
      <div>
        <h1 style="font-size: 20px; font-weight: bold;">Internat Schloss Hagerhof</h1>
        <p style="font-size: 12px; color: #94a3b8;">Wohngruppe Remise</p>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 20px;">
      <div style="text-align: right;">
        <div id="current-date" style="font-size: 13px; color: #cbd5e1;"></div>
        <div id="current-time" style="font-size: 22px; font-weight: bold; color: #c5a059;"></div>
      </div>
      <button onclick="toggleModal()" class="btn-sec" style="font-size: 12px;">Bearbeiten</button>
    </div>
  </header>

  <!-- Slide 1: Dienstplan -->
  <main id="slide-1" class="slide active">
    <h2>📅 Dienstplan der Betreuer</h2>
    <div id="roster-grid" class="grid-6"></div>
  </main>

  <!-- Slide 2: Speiseplan -->
  <main id="slide-2" class="slide">
    <h2>🍽️ Wochenspeiseplan</h2>
    <div id="menu-grid" class="grid-5"></div>
  </main>

  <!-- Slide 3: Termine -->
  <main id="slide-3" class="slide">
    <h2>⭐ Wichtige Termine & Aktivitäten</h2>
    <div id="events-grid" class="grid-2"></div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="progress-container"><div id="progress" class="progress-bar"></div></div>
    <div class="footer-info">
      <div>Seitenwechsel alle 12 Sek.</div>
      <div id="slide-ind" style="font-weight: bold; color: #fff;">Seite 1 von 3</div>
      <div>Remise Dashboard</div>
    </div>
  </footer>

  <!-- Admin Modal -->
  <div id="edit-modal">
    <div class="modal-content">
      <h3 style="color: #c5a059;">Dashboard Daten bearbeiten</h3>
      <div id="modal-body" class="modal-body"></div>
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button onclick="toggleModal()" class="btn-sec">Abbrechen</button>
        <button onclick="saveData()" class="btn">Speichern</button>
      </div>
    </div>
  </div>

  <script>
    const defaultData = {
      roster: [
        { day: 'Sonntag', night: 'Hr. Müller', tag1: 'Fr. Weber', tag2: '', tag3: '' },
        { day: 'Montag', night: 'Fr. Schmidt', tag1: 'Hr. Müller', tag2: 'Fr. Meyer', tag3: '' },
        { day: 'Dienstag', night: 'Hr. Becker', tag1: 'Fr. Schmidt', tag2: 'Hr. Wagner', tag3: 'Fr. Schulz' },
        { day: 'Mittwoch', night: 'Fr. Weber', tag1: 'Hr. Becker', tag2: 'Fr. Hoffmann', tag3: '' },
        { day: 'Donnerstag', night: 'Hr. Müller', tag1: 'Fr. Schmidt', tag2: '', tag3: '' },
        { day: 'Freitag', night: 'Fr. Meyer', tag1: 'Hr. Becker', tag2: 'Fr. Weber', tag3: '' }
      ],
      menu: [
        { day: 'Montag', dinner: 'Abendbrotzeit', sub: 'Brotauswahl, Aufschnitt & Salat' },
        { day: 'Dienstag', dinner: 'Gekochtes Abendessen', sub: 'Warmes Hauptgericht & Nachtisch' },
        { day: 'Mittwoch', dinner: 'Gekochtes Abendessen', sub: 'Warmes Hauptgericht mit Beilagen' },
        { day: 'Donnerstag', dinner: 'Reste-Essen & Brotzeit', sub: 'Warme Reste & Brotauswahl' },
        { day: 'Freitag', dinner: 'Abreise', sub: 'Heimreise (kein Abendessen)' }
      ],
      events: [
        { title: 'Gruppenabend Remise', time: 'Dienstag, 19:00', desc: 'Gemeinsame Wochenbesprechung.' },
        { title: 'Zimmer-Check', time: 'Mittwoch, 16:30', desc: 'Sauberkeits- und Ordnungskontrolle.' },
        { title: 'Lernzeit / Hausaufgaben', time: 'Mo - Do, 17:00 - 18:30', desc: 'Feste Lernphase mit Betreuung.' },
        { title: 'Wochenend-Abreise', time: 'Freitag, ab 13:30', desc: 'Abmeldung vor der Heimfahrt.' }
      ]
    };

    let data = JSON.parse(localStorage.getItem('remise_data')) || defaultData;
    let currentSlide = 1;
    const totalSlides = 3;
    let timer, progressTimer;
    const duration = 12000;

    function init() {
      updateClock();
      setInterval(updateClock, 1000);
      renderRoster();
      renderMenu();
      renderEvents();
      startSlides();
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('current-date').innerText = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
      document.getElementById('current-time').innerText = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    }

    function renderRoster() {
      const today = new Date().toLocaleDateString('de-DE', { weekday: 'long' });
      const grid = document.getElementById('roster-grid');
      grid.innerHTML = data.roster.map(r => {
        const isToday = r.day.toLowerCase() === today.toLowerCase();
        let tags = [r.tag1, r.tag2, r.tag3].filter(Boolean).map(t => `<div class="box-info">☀️ ${t}</div>`).join('');
        return `
          <div class="card ${isToday ? 'today' : ''}">
            ${isToday ? '<div class="badge-today">HEUTE</div>' : ''}
            <div>
              <h3>${r.day}</h3>
              <div class="section-title">Nachtdienst</div>
              <div class="box-info" style="font-weight:bold; color:#93c5fd;">🌙 ${r.night || 'Offen'}</div>
              <div class="section-title">Tagdienst</div>
              ${tags || '<div style="font-size:11px; color:#64748b; margin-top:4px;">Kein Tagdienst</div>'}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderMenu() {
      const today = new Date().toLocaleDateString('de-DE', { weekday: 'long' });
      const grid = document.getElementById('menu-grid');
      grid.innerHTML = data.menu.map(m => {
        const isToday = m.day.toLowerCase() === today.toLowerCase();
        return `
          <div class="card ${isToday ? 'today' : ''}">
            ${isToday ? '<div class="badge-today">HEUTE</div>' : ''}
            <div>
              <h3>${m.day}</h3>
              <div class="section-title">Frühstück</div>
              <div class="box-info" style="font-size:11px;">Buffet (Brötchen, Müsli)</div>
              <div class="section-title">Abendessen</div>
              <div class="box-info" style="font-weight:bold; color:#c5a059;">${m.dinner}</div>
              <div style="font-size:11px; color:#94a3b8; margin-top:4px;">${m.sub}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderEvents() {
      const grid = document.getElementById('events-grid');
      grid.innerHTML = data.events.map(e => `
        <div class="card" style="border-left: 4px solid #c5a059;">
          <div>
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
              <strong style="font-size:15px; color:#fff;">${e.title}</strong>
              <span style="font-size:11px; background:#334155; padding:2px 6px; border-radius:4px; color:#c5a059;">${e.time}</span>
            </div>
            <p style="font-size:12px; color:#cbd5e1; margin-top:5px;">${e.desc}</p>
          </div>
        </div>
      `).join('');
    }

    function showSlide(n) {
      document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
      document.getElementById('slide-' + n).classList.add('active');
      document.getElementById('slide-ind').innerText = `Seite ${n} von ${totalSlides}`;
      currentSlide = n;
      resetProgress();
    }

    function startSlides() {
      clearInterval(timer);
      timer = setInterval(() => {
        let next = currentSlide >= totalSlides ? 1 : currentSlide + 1;
        showSlide(next);
      }, duration);
      resetProgress();
    }

    function resetProgress() {
      clearInterval(progressTimer);
      let start = Date.now();
      let bar = document.getElementById('progress');
      progressTimer = setInterval(() => {
        let p = ((Date.now() - start) / duration) * 100;
        if (p >= 100) p = 100;
        bar.style.width = p + '%';
      }, 50);
    }

    function toggleModal() {
      const m = document.getElementById('edit-modal');
      m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
      if (m.style.display === 'flex') {
        let html = '';
        data.roster.forEach((r, i) => {
          html += `<div class="input-group"><label>${r.day} - Nacht</label><input type="text" id="rn-${i}" value="${r.night}"></div>`;
          html += `<div class="input-group"><label>${r.day} - Tag 1</label><input type="text" id="rt1-${i}" value="${r.tag1}"></div>`;
        });
        document.getElementById('modal-body').innerHTML = html;
      }
    }

    function saveData() {
      data.roster.forEach((r, i) => {
        r.night = document.getElementById(`rn-${i}`).value;
        r.tag1 = document.getElementById(`rt1-${i}`).value;
      });
      localStorage.setItem('remise_data', JSON.stringify(data));
      renderRoster();
      toggleModal();
    }

    window.onload = init;
  </script>
</body>
</html>
